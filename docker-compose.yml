services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${LOCAL_NEO4J_USER:-neo4j}/${LOCAL_NEO4J_PASSWORD:-copilot-dev-only}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot-dev-only}@postgres:5432/copilot
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-copilot-dev-only}
      DATASET_ROOT: /dataset
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./assets/flytbase-dataset/sample-data:/dataset:ro
      - ./assets/flytbase-dataset/02-dataset-guide.md:/02-dataset-guide.md:ro
      - model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot-dev-only}@postgres:5432/copilot
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-copilot-dev-only}
      DATASET_ROOT: /dataset
      MEM0_HISTORY_PATH: /data/mem0/history.db
    volumes:
      - ./assets/flytbase-dataset/sample-data:/dataset:ro
      - ./assets/flytbase-dataset/02-dataset-guide.md:/02-dataset-guide.md:ro
      - model_cache:/root/.cache
      - mem0_data:/data/mem0
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  # Task 3N: nao analytics sidecar.
  # Profile-gated on purpose: the image builds, but it currently exits at startup because
  # apps/shared/src/chart-builder.tsx imports `recharts` while apps/shared/package.json never
  # declares it; it used to resolve through the frontend workspace, which the lean image omits.
  # Nothing in the default stack depends on this service. See infra/nao/README.md.
  nao:
    profiles: ["nao"]
    image: asset-copilot/nao:975ec422
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      BETTER_AUTH_URL: http://nao:5005
      NAO_DEFAULT_PROJECT_PATH: /nao-project
      NAO_CONTEXT_SOURCE: local
      # Separate internal metadata DB; never shares the Copilot's Postgres credentials.
      DB_URI: sqlite:/app/data/nao-metadata.db
      NAO_STORAGE_BACKEND: none
      ENABLE_USER_LOGIN: "true"
      ENABLE_USER_SIGNUP: "false"
      MCP_ENDPOINT_ENABLED: "true"
      # Outbound Asset Knowledge MCP: each call signs a capability with this shared secret
      # (same value as backend COPILOT_MCP_SECRET, from data/nao-secrets.env).
      COPILOT_ASSET_SERVER: asset-knowledge
    env_file:
      - path: data/nao-secrets.env
        required: true
    volumes:
      - ./infra/nao/project:/nao-project:ro
      - nao_data:/app/data
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5005/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      args:
        # Public origin the browser calls the backend on. Not a secret.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        # Client key for OpenUI Reliability telemetry. Public by design; read from
        # the shell/.env at build time so it is never committed.
        NEXT_PUBLIC_OPENUI_API_KEY: ${NEXT_PUBLIC_OPENUI_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  model_cache:
  mem0_data:
  nao_data:
