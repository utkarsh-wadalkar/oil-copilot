services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${LOCAL_NEO4J_USER:-neo4j}/${LOCAL_NEO4J_PASSWORD:-copilot-dev-only}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot-dev-only}@postgres:5432/copilot
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-copilot-dev-only}
      DATASET_ROOT: /dataset
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./assets/flytbase-dataset/sample-data:/dataset:ro
      - ./assets/flytbase-dataset/02-dataset-guide.md:/02-dataset-guide.md:ro
      - model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot-dev-only}@postgres:5432/copilot
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-copilot-dev-only}
      DATASET_ROOT: /dataset
      MEM0_HISTORY_PATH: /data/mem0/history.db
    volumes:
      - ./assets/flytbase-dataset/sample-data:/dataset:ro
      - ./assets/flytbase-dataset/02-dataset-guide.md:/02-dataset-guide.md:ro
      - model_cache:/root/.cache
      - mem0_data:/data/mem0
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  model_cache:
  mem0_data:
