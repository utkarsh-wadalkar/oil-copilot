[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-intelligence-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1",
  "PyJWT>=2.8,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
nao = ["mcp>=2,<3"]
memory = [
  "mem0ai==2.2.1",
  "sentence-transformers>=6.1,<7",
  "neo4j>=5.28,<6",
  "psycopg[pool]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
