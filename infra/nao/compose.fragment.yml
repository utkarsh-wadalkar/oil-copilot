# =============================================================================
# Task 3N — nao analytics sidecar. MERGE THE `nao:` SERVICE INTO THE ROOT
# docker-compose.yml. The controller owns docker-compose.yml, so this file is a
# fragment; two workers must never edit the same file.
#
# To merge:
#   1. Paste the `nao:` service below under `services:` (sibling of `backend`).
#   2. Add `nao_data:` to the top-level `volumes:` map.
#   3. Build the image first:  pwsh infra/nao/setup-nao.ps1
#   4. Ensure the referenced files exist:
#        data/nao-secrets.env   (git-ignored, generated by secrets/generate_nao_secrets.py)
#        infra/nao/project/     (tracked, mounted read-only)
#
# The service joins the default compose network, so it reaches the Copilot API
# at http://backend:8000/mcp (the Asset Knowledge MCP) and the backend reaches it
# at http://nao:5005/mcp/<projectId>.
#
# Validate this fragment in isolation, WITHOUT touching docker-compose.yml:
#   docker compose -f infra/nao/compose.fragment.yml --profile validate build
#   docker compose -f infra/nao/compose.fragment.yml --profile validate up -d
# (the `nao-validate` service below is a self-contained private-network stack).
# =============================================================================
services:
  # ---- the real service: image pre-built by setup-nao.ps1 ------------------
  nao:
    image: asset-copilot/nao:975ec422
    restart: unless-stopped
    # Loopback only, for host debugging; the sidecar is otherwise private.
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      BETTER_AUTH_URL: http://nao:5005
      NAO_DEFAULT_PROJECT_PATH: /nao-project
      NAO_CONTEXT_SOURCE: local
      # Separate internal metadata DB; never shares the Copilot's Postgres creds.
      DB_URI: sqlite:/app/data/nao-metadata.db
      NAO_STORAGE_BACKEND: none
      ENABLE_USER_LOGIN: "true"
      ENABLE_USER_SIGNUP: "false"
      MCP_ENDPOINT_ENABLED: "true"
      # Outbound Asset Knowledge MCP: each call signs a capability with this
      # shared secret (same value as backend COPILOT_MCP_SECRET).
      COPILOT_ASSET_SERVER: asset-knowledge
    env_file:
      - path: data/nao-secrets.env
        required: true
    volumes:
      - ./infra/nao/project:/nao-project:ro
      - nao_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5005/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # NOTE: after merging into the root compose file you may add
    #   depends_on: { backend: { condition: service_started } }
    # It is intentionally omitted here so this fragment validates on its own
    # (a bare `depends_on: backend` is an undefined service in this file).

  # ---- self-contained validation stack (profile: validate) -----------------
  # Builds the image from source and runs it on its own private network with a
  # throwaway secret, so the sidecar can be smoke-tested without the full stack.
  nao-validate:
    profiles: ["validate"]
    build:
      context: ../..
      dockerfile: infra/nao/Dockerfile
      args:
        APP_COMMIT: 975ec422b9625be2369638273b79c5ef60a7b213
    image: asset-copilot/nao:local-validate
    environment:
      BETTER_AUTH_URL: http://nao-validate:5005
      NAO_DEFAULT_PROJECT_PATH: /nao-project
      NAO_CONTEXT_SOURCE: local
      DB_URI: sqlite:/app/data/nao-metadata.db
      NAO_STORAGE_BACKEND: none
      ENABLE_USER_LOGIN: "true"
      ENABLE_USER_SIGNUP: "false"
      MCP_ENDPOINT_ENABLED: "true"
      BETTER_AUTH_SECRET: validation-only-not-a-real-secret-0000000000
      COPILOT_ASSET_SERVER: asset-knowledge
    volumes:
      - ./project:/nao-project:ro
      - nao_validate_data:/app/data
    ports:
      - "127.0.0.1:15005:5005"

volumes:
  nao_data:
  nao_validate_data:
